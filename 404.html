<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
   // Ne pas ajouter index.html si déjà présent
    const baseHref = '/CEF_devoirs_au-petit-village/';
    const currentPath = window.location.pathname + window.location.search + window.location.hash;
    
    if (!currentPath.includes('index.html')) {
      // Supprime le / de fin si présent
      const cleanBase = baseHref.endsWith('/') ? baseHref.slice(0, -1) : baseHref;
      window.location.replace(cleanBase + '/index.html' + currentPath.substring(cleanBase.length));
    }
  </script>
</head>
<body>
  Redirection en cours...
</body>
</html>
